    <circle cx="105" cy="240" r="16" fill="#9aa0a8"/>
    <circle cx="300" cy="240" r="36" fill="#2a2e34"/>
    <circle cx="300" cy="240" r="16" fill="#9aa0a8"/>
    <circle cx="370" cy="240" r="36" fill="#2a2e34"/>
    <circle cx="370" cy="240" r="16" fill="#9aa0a8"/>
  </g>
</svg>