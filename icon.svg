<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#62c9f0"/>
      <stop offset="100%" stop-color="#3aabd8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g filter="url(#sh)" transform="translate(40,90)">
    <!-- dump bed -->
    <path d="M190 70 L400 70 L400 210 L190 210 Z" fill="#d5dae0"/>
    <path d="M190 70 L400 70 L395 95 L195 95 Z" fill="#eef1f4"/>
    <rect x="200" y="165" width="190" height="14" rx="2" fill="#4bb8e0"/>
