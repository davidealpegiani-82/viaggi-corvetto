    <path d="M70 165 Q130 130 175 168" fill="none" stroke="#f0b020" stroke-width="8" stroke-linecap="round"/>
    <!-- badge -->
    <circle cx="95" cy="185" r="14" fill="#fff"/>
    <!-- chassis -->
    <rect x="48" y="210" width="340" height="16" fill="#2a2e34"/>
